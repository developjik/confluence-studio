[package]
name = "confluence-studio"
version = "0.1.0"
description = "Confluence Studio — manage, author, export Confluence content; AI chat via Damon"
authors = ["developjik"]
edition = "2024"

[lib]
name = "confluence_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
tokio-tungstenite = "0.30"
quick-xml = "0.37"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
directories = "6"
percent-encoding = "2"
regex = "1"

[dev-dependencies]
wiremock = "0.6"
axum = { version = "0.8", features = ["ws"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Deploy-demo workflow — copy to .github/workflows/deploy-demo.yml
# The Pickle GitHub App on this account has no `workflows` permission, so this
# file ships under docs/ instead. Paste it at .github/workflows/deploy-demo.yml
# in the GitHub web editor; steps are in docs/demo-setup.md.
#
# Builds the demo bundle (`vite build --mode demo`, VITE_DEMO=1 → src/demo
# in-memory backend, no Tauri / Confluence / Damon) with the GitHub Pages
# sub-path base and publishes it with GitHub Pages (source: GitHub Actions).
# The static landing page that used to be served from docs/ is published under
# /landing/ so the existing link keeps working.

name: deploy-demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build demo bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build demo (tsc + vite, base=/confluence-studio/)
        run: pnpm build:demo
        env:
          VITE_BASE_PATH: /confluence-studio/

      # Keep the marketing landing page reachable at /landing/ after the root
      # starts serving the demo app.
      - name: assemble landing page
        run: |
          mkdir -p dist/landing
          cp docs/index.html dist/landing/index.html
          cp docs/icon.png dist/landing/icon.png
          cp -r docs/screenshots dist/landing/screenshots

      - name: add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
